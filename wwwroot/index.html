<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <base href="/" />
    <link href="css/output.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link
      rel="icon"
      type="image/png"
      href="https://img.icons8.com/?size=100&id=48255&format=png&color=000000"
    />
    <link href="TaskFlow.styles.css" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem;font-family:system-ui,sans-serif">
        <div style="width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#6366f1;border-radius:50%;animation:spin 0.75s linear infinite"></div>
        <p style="color:#9ca3af;font-size:0.875rem;margin:0">Loading...</p>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
